# Render Blueprint for the Socket.io realtime server (backend/src/server.js).
# The REST API runs on Vercel; this long-running service pushes notifications and
# task updates to browsers over WebSockets. It also serves the same REST API.
# Render dashboard -> New -> Blueprint -> select this repository.
services:
  - type: web
    name: taskflow-realtime
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_EXPIRES_IN
        value: 7d
      # Set these in the Render dashboard. JWT_SECRET must be the SAME value as the
      # Vercel API, because the API issues the socket tokens this server verifies.
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CLIENT_URL # the frontend URL, e.g. https://taskflow-nu-lake.vercel.app
        sync: false
