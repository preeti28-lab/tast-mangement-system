<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline · TaskFlow</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        background: #fafafa; color: #18181b;
      }
      @media (prefers-color-scheme: dark) { body { background: #09090b; color: #f4f4f5; } p { color: #a1a1aa; } }
      main { max-width: 360px; text-align: center; }
      img { width: 64px; height: 64px; }
      h1 { font-size: 20px; margin: 16px 0 8px; }
      p { color: #52525b; line-height: 1.5; margin: 0 0 20px; }
      button { background: #4f46e5; color: #fff; border: 0; border-radius: 8px; padding: 10px 16px; font-weight: 600; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icon-192.png" alt="" />
      <h1>You're offline</h1>
      <p>This page hasn't been saved on this device yet. Pages you've already opened still work offline, and changes you make will sync when you're back online.</p>
      <button onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
